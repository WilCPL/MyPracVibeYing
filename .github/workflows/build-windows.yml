name: Build Windows Test Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package files for artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Copy-WithRobocopy {
            param(
              [Parameter(Mandatory = $true)][string]$Source,
              [Parameter(Mandatory = $true)][string]$Destination,
              [string[]]$ExcludeDirs = @()
            )

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null

            $excludeArgs = @()
            foreach ($dir in $ExcludeDirs) {
              $excludeArgs += @("/XD", $dir)
            }

            robocopy $Source $Destination /E @excludeArgs
            $exitCode = $LASTEXITCODE
            if ($exitCode -gt 7) {
              throw "Robocopy failed for $Source with exit code $exitCode"
            }
            Write-Host "Robocopy for $Source completed with code $exitCode (treated as success)."
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item run_app.bat dist/ -Force
          Copy-Item requirements.txt dist/ -Force

          Copy-WithRobocopy -Source "backend" -Destination "dist/backend" -ExcludeDirs @("venv")

          if (Test-Path frontend) {
            Copy-WithRobocopy -Source "frontend" -Destination "dist/frontend" -ExcludeDirs @("node_modules")
          } else {
            Write-Host "frontend directory not found; skipping copy."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-dist
          path: dist/
          if-no-files-found: error
